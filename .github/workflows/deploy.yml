name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # デプロイをトリガーするブランチ
  workflow_dispatch:

# 連続で push されたときは最新のものだけデプロイする
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 記事の投稿日・更新日を git 履歴から取るため

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # 一覧JSONをビルド直前に生成し、新しい記事がすぐ一覧に出るようにする
      # （リポジトリへのJSONのコミットは generate-file-list.yml が行う）
      - name: Generate article lists
        run: |
          node generateFileList.cjs
          node generateFileList.cjs public/blog/md public/blogList.json public/blogNewArticles.json

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
